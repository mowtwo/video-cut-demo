# 本地一键起全栈：web(nginx) + api(Hono) + render(Go/ffmpeg) + asr(faster-whisper)
#   docker compose up -d --build
#   打开 http://localhost:5173
#
# 说明：
# - api 与 render 共享 ./data 卷(媒体/缩略图/成片/sqlite)，二者用同一套绝对路径。
# - 容器内 ffmpeg 为全功能版(含 libass/freetype/fontconfig + Noto CJK)，大字标题/字幕可用。
# - 容器内无法用 macOS VideoToolbox 硬件加速，统一软编 libx264(RENDER_HWACCEL=none)。
# - AI 可选：在 .env 设 AI_API_KEY(OpenAI 兼容)；不设则前端隐藏 AI、主流程不受影响。

services:
  render:
    build:
      context: ./svc/render
    environment:
      RENDER_HOST: 0.0.0.0
      RENDER_PORT: "8790"
      RENDER_HWACCEL: none
      FFMPEG_BIN: ffmpeg
      FFPROBE_BIN: ffprobe
    volumes:
      - ./data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: "8787"
      DATA_DIR: /data
      RENDER_URL: http://render:8790
      RENDER_HWACCEL: none
      ASR_URL: http://asr:9000
      ASR_MODEL: ${ASR_MODEL:-base}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      - ./data:/data
    depends_on:
      - render
      - asr
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  # 自动字幕的语音识别服务(faster-whisper)。不需要字幕可不启动它。
  asr:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${ASR_MODEL:-base}
    volumes:
      - ./data/asr-cache:/root/.cache # 模型缓存，避免重复下载
    restart: unless-stopped
