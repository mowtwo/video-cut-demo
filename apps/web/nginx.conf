server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2g;   # 允许大视频上传

    # /api/* 反代到 api 服务，并剥掉 /api 前缀(与 vite dev 代理行为一致)
    location /api/ {
        proxy_pass http://api:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;     # 上传大文件不缓冲
        proxy_buffering off;             # SSE 进度需要关闭缓冲
        proxy_read_timeout 3600s;        # 渲染可能较久
    }

    # 前端 SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
